[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "faintmark"
version = "0.1.0"
description = "Local invisible image watermarks with recipient-specific copies, a CLI, and MCP tools."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "MIT"
dependencies = [
  "trustmark==0.9.2",
  "torch==2.14.1",
  "torchvision==0.29.1",
  "Pillow>=11,<13",
  "numpy>=1.26,<3",
  "mcp>=1.26,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]

[project.scripts]
faintmark = "faintmark.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/faintmark"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires downloaded watermark model files"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
