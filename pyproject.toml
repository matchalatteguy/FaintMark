[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "copymark"
version = "0.1.0"
description = "Local invisible image watermarks with recipient-specific copies, a CLI, and MCP tools."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "MIT"
dependencies = [
  "trustmark==0.9.2",
  "torch==2.14.1",
  "torchvision==0.29.1",
  "Pillow>=11,<13",
  "numpy>=1.26,<3",
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "python-multipart>=0.0.18,<1",
  "mcp>=1.26,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "ruff>=0.9,<1"]
research = ["scikit-image>=0.24,<0.27"]

[project.scripts]
copymark = "copymark.cli:main"
copymark-mcp = "copymark.mcp_server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/copymark"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires downloaded watermark model files"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
