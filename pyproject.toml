[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "faintmark"
version = "0.1.0"
description = "Invisible per-recipient image watermarks designed to survive chat-app compression. CLI and MCP server."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "matchalatteguy" }]
keywords = ["watermark", "invisible-watermark", "image-watermarking", "leak-tracing", "traitor-tracing", "trustmark", "mcp", "mcp-server", "cli"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: End Users/Desktop",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Multimedia :: Graphics",
  "Topic :: Security",
]
dependencies = [
  "onnxruntime>=1.20",
  "numpy>=1.26",
  "pillow>=11",
  "mcp>=1.26,<2",
  "typing-extensions>=4.5",
]

[project.optional-dependencies]
heic = ["pillow-heif>=1.0"]

[project.urls]
Homepage = "https://github.com/matchalatteguy/FaintMark"
Repository = "https://github.com/matchalatteguy/FaintMark"
Issues = "https://github.com/matchalatteguy/FaintMark/issues"
Changelog = "https://github.com/matchalatteguy/FaintMark/releases"

[project.scripts]
faintmark = "faintmark.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.9"]

[tool.hatch.build.targets.wheel]
packages = ["src/faintmark"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs the downloaded TrustMark models"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
