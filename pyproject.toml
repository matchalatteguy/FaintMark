[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "faintmark"
version = "0.1.0"
description = "Local invisible image watermarks with recipient-specific copies, a CLI, and MCP tools."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
  "onnxruntime>=1.20",
  "numpy>=1.26",
  "pillow>=11",
  "mcp>=1.26,<2",
  "typing-extensions>=4.5",
]

[project.optional-dependencies]
heic = ["pillow-heif>=1.0"]

[project.scripts]
faintmark = "faintmark.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.9"]

[tool.hatch.build.targets.wheel]
packages = ["src/faintmark"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs the downloaded TrustMark models"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
